name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  build-and-frame-policy:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and verify app signature
        run: ./scripts/build.sh
      - name: Check capture cadence and presentation policy
        run: ./scripts/check-frame-policy.sh
